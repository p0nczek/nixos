[[template]]
id = "niri"
name = "Niri Border Colors"
description = "Sync Niri borders with Noctalia accent color"
author = "shin"
version = "1.0.0"
enabled = true

[[template.files]]
path = "/etc/nixos/niri/noctalia.kdl"
template = """
layout {

    focus-ring {
        active-color   "{{accent}}"
        inactive-color "{{surfaceContainerLowest}}"
        urgent-color   "{{error}}"
    }

    border {
        active-color   "{{accent}}"
        inactive-color "{{surfaceContainerLowest}}"
        urgent-color   "{{error}}"
    }

    shadow {
        color "{{shadow}}70"
    }

    tab-indicator {
        active-color   "{{accent}}"
        inactive-color "{{secondaryContainer}}"
        urgent-color   "{{error}}"
    }

    insert-hint {
        color "{{accent}}80"
    }
}

recent-windows {
    highlight {
        active-color "{{accent}}"
        urgent-color "{{error}}"
    }
}
"""
